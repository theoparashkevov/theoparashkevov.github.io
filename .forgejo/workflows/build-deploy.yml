# Test, build and deploy the blog to the internal development cluster.
# Process documentation: docs/handbook/deployment.md
#
# Adapted from the company Forgejo Actions template (k8s-app-template). Differences:
#   - a `test` job gates the image build (checks, lint, format, unit tests, build);
#   - there is NO production deployment: production is GitHub Pages, fed by the
#     Forgejo -> GitHub push mirror and .github/workflows/deploy.yml on `master`;
#   - the app name is fixed (`theoparashkevov-blog`) instead of the repository name,
#     because `theoparashkevov.github.io` contains dots, which are invalid in Service
#     names and would break the single-level *.development.binary-rise hostname.

name: Test, Build and Deploy

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - master

env:
  IMAGE: harbor.internal.binary-rise/library/theoparashkevov-blog
  # SITE_URL is baked into canonical URLs, Open Graph tags, RSS and the sitemap at
  # BUILD time (astro.config.mjs), so each image is built for the environment it
  # is deployed to.
  SITE_URL_DEVELOPMENT: https://theoparashkevov-blog.development.binary-rise
  NAMESPACE: development
  OVERLAY: k8s/overlays/development
  DEPLOYMENT: theoparashkevov-blog

jobs:
  test:
    runs-on: docker

    container:
      # Astro 7 needs Node >= 22.22; matches .nvmrc.
      image: node:24-bookworm

    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        # The build fails on invalid post front matter (zod schema), so it is also
        # a content test.
        run: npm run build

  build-and-push:
    needs: test
    runs-on: docker

    container:
      image: node:lts-bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y docker.io curl ca-certificates

      - name: Check Docker
        run: |
          docker version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure variables
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Image: ${IMAGE}:${IMAGE_TAG}"
          echo "Branch: ${{ github.ref_name }}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          case "${{ github.event_name }}:${{ github.ref_name }}" in
            push:development) echo "SITE_URL=${SITE_URL_DEVELOPMENT}" >> "$GITHUB_ENV" ;;
            *)
              # PR builds: the image is built as a gate but never pushed or deployed.
              echo "SITE_URL=https://pr.invalid" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Login to Harbor
        # Login and push only for branch pushes. PR runs build the image as a gate
        # but never touch the registry.
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            docker login harbor.internal.binary-rise \
              -u '${{ secrets.HARBOR_USERNAME }}' \
              --password-stdin

      - name: Build image
        run: |
          docker build \
            -f astro-site/Dockerfile \
            --build-arg SITE_URL="${SITE_URL}" \
            -t "${IMAGE}:${IMAGE_TAG}" \
            astro-site

      - name: Push image
        if: ${{ github.event_name == 'push' }}
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"

  deploy-development:
    needs: build-and-push
    if: ${{ github.event_name == 'push' && github.ref_name == 'development' }}
    runs-on: docker

    container:
      image: node:lts-bookworm
      volumes:
        - /home/developer/forgejo-runners/kubeconfig:/root/.kube/config:ro

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl ca-certificates

          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"

          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

      - name: Check Kubernetes access
        run: |
          kubectl version --client
          # Verify every permission this job needs up front, so a missing RBAC rule
          # fails here with a pointer instead of midway through the deploy.
          missing=""
          for check in \
            "create deployments" \
            "get deployments" \
            "list pods" \
            "create services" \
            "create secrets" \
            "create ingresses"; do
            if ! kubectl auth can-i ${check} -n "${NAMESPACE}" >/dev/null; then
              missing="${missing}  - cannot ${check}\n"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "MISSING PERMISSIONS in namespace ${NAMESPACE}:" >&2
            printf "${missing}" >&2
            echo "A cluster admin must apply the forgejo-deployer Role/RoleBinding" >&2
            echo "(see docs/handbook/deployment.md), then re-run this job." >&2
            exit 1
          fi
          echo "all deploy permissions present in ${NAMESPACE}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes manifests
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Image tag: ${IMAGE_TAG}"
          sed -i "s/IMAGE_TAG/${IMAGE_TAG}/g" "${OVERLAY}/kustomization.yaml"

      - name: Create registry pull secret
        run: |
          kubectl -n "${NAMESPACE}" create secret docker-registry harbor-registry \
            --docker-server=harbor.internal.binary-rise \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k "${OVERLAY}"

      - name: Wait for rollout
        run: |
          kubectl rollout status "deployment/${DEPLOYMENT}" -n "${NAMESPACE}" --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get deployment "${DEPLOYMENT}" -n "${NAMESPACE}"
          kubectl get pods -n "${NAMESPACE}" -l "app=${DEPLOYMENT}"
          kubectl get service "${DEPLOYMENT}" -n "${NAMESPACE}"
          kubectl get ingress "${DEPLOYMENT}" -n "${NAMESPACE}"
